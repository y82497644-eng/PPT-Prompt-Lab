<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="description" content="把一个想法，变成一份清楚、好看的演示文稿。" />
  <title>页间 · 轻松做好一份 PPT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="返回首页"><span class="brand-mark">页</span><span>页间</span></button>
      <div class="stepper" aria-label="制作进度"><span class="step is-active" data-step="1">1 <b>开始</b></span><i></i><span class="step" data-step="2">2 <b>整理</b></span><i></i><span class="step" data-step="3">3 <b>生成</b></span></div>
      <button class="quiet-button" id="newProjectBtn">新建</button>
    </header>

    <main>
      <section class="view home-view is-active" data-view="home">
        <div class="hero-copy">
          <p class="eyebrow">从想法到演示，只差几分钟</p>
          <h1>你想讲一个<br><em>什么故事？</em></h1>
          <p>输入主题，或放入你的资料。我们会先帮你整理成逐页大纲，你随时可以调整。</p>
        </div>
        <div class="composer-card">
          <label class="sr-only" for="topicInput">演示文稿主题</label>
          <textarea id="topicInput" maxlength="240" placeholder="例如：为大学课程准备一份新能源汽车行业趋势分析……"></textarea>
          <div class="composer-actions">
            <label class="upload-button" for="fileInput"><span>＋</span> 添加资料<input id="fileInput" type="file" multiple accept=".pdf,.doc,.docx,.txt,.md,.ppt,.pptx" /></label>
            <span class="file-note" id="fileNote">支持 PDF、Word、PPT、文本</span>
            <button class="primary-button" id="startBtn">开始整理 <span>→</span></button>
          </div>
          <div class="file-list" id="fileList" aria-live="polite"></div>
          <p class="input-error" id="inputError" role="alert"></p>
        </div>

        <section class="styles-section" aria-labelledby="stylesTitle">
          <div class="section-title"><div><span>视觉风格</span><h2 id="stylesTitle">选一个喜欢的气质</h2></div><p>之后还可以更换</p></div>
          <div class="style-grid" id="styleGrid"></div>
        </section>
        <div class="trust-row"><span>不需要注册</span><span>先看大纲再生成</span><span>你的资料仅用于本次编辑</span></div>
      </section>

      <section class="view storyboard-view" data-view="storyboard">
        <div class="workspace-head">
          <div><button class="back-button" data-route="home">← 返回</button><p class="eyebrow">页面大纲</p><h1 id="deckTitle">演示文稿</h1><p>拖动页面调整顺序，点击文字即可修改。</p></div>
          <button class="primary-button" id="generateBtn">生成演示文稿 <span>→</span></button>
        </div>
        <div class="storyboard-toolbar"><strong><span id="slideCount">0</span> 页</strong><span>每页聚焦一个重点</span><button class="quiet-button" id="addSlideBtn">＋ 新增页面</button></div>
        <div class="slides-list" id="slidesList"></div>
      </section>

      <section class="view progress-view" data-view="progress">
        <div class="progress-wrap">
          <div class="progress-art" aria-hidden="true"><div class="page-stack page-one"></div><div class="page-stack page-two"></div><div class="page-stack page-three"><span></span><span></span><span></span></div></div>
          <p class="eyebrow">正在准备你的演示文稿</p>
          <h1 id="progressTitle">让内容和画面一一对应</h1>
          <p id="progressMessage">正在整理版式，请稍等片刻。</p>
          <div class="progress-track"><span id="progressBar"></span></div>
          <div class="progress-meta"><span id="progressPercent">0%</span><span id="progressStage">分析页面结构</span></div>
          <button class="quiet-button hidden" id="previewBtn">查看预览原型</button>
        </div>
      </section>

      <section class="view preview-view" data-view="preview">
        <div class="workspace-head"><div><button class="back-button" data-route="storyboard">← 返回大纲</button><p class="eyebrow">预览</p><h1>你的演示文稿已准备好</h1><p>这是 Sprint 1 的预览原型，暂不生成 PPTX 文件。</p></div><button class="primary-button" disabled>下载 PPTX（即将开放）</button></div>
        <div class="preview-stage" id="previewStage"></div>
      </section>
    </main>
  </div>
  <template id="slideTemplate"><article class="slide-card" draggable="true"><button class="drag-handle" aria-label="拖动排序">⠿</button><div class="slide-number"></div><div class="slide-preview"><span class="mini-kicker"></span><strong class="mini-title"></strong><i></i><i></i></div><div class="slide-content"><input class="slide-kicker" aria-label="页面类型" /><textarea class="slide-title" rows="2" aria-label="页面标题"></textarea><textarea class="slide-body" rows="2" aria-label="页面内容"></textarea></div><div class="slide-actions"><button class="icon-button regenerate" title="重新生成本页">↻<span>重新生成</span></button><button class="icon-button delete" title="删除本页">×</button></div></article></template>
  <script src="app.js"></script>
</body>
</html>
